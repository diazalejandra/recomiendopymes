name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Valores dummy: los tests usan un fake-DB en memoria, no conectan a Mongo.
      MONGO_URL: "mongodb://localhost:27017"
      DB_NAME: "test"
      SECRET_KEY: "ci-test-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build

  web:
    name: Web Next.js (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URL: "mongodb://localhost:27017"
      DB_NAME: "recomiendopymes"
      SECRET_KEY: "ci-e2e-secret"
    steps:
      - uses: actions/checkout@v4

      # --- Backend: instalar, sembrar y arrancar ---
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Sembrar MongoDB
        working-directory: backend
        run: python seed_data.py
      - name: Arrancar backend (background) y esperar /api/health
        working-directory: backend
        run: |
          nohup python -m uvicorn server:app --port 8000 --host 127.0.0.1 > backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "Backend listo"; exit 0
            fi
            sleep 1
          done
          echo "Backend no respondió"; cat backend.log; exit 1

      # --- Web (Next): deps + build de prod (Playwright levanta `next start`) ---
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias web
        working-directory: web
        run: npm ci
      - name: Compilar web (prod)
        working-directory: web
        # El e2e corre contra el build de prod (next start), nunca next dev.
        # API_PROXY_TARGET apunta al backend local que arrancamos arriba.
        env:
          API_PROXY_TARGET: "http://127.0.0.1:8000"
        run: npm run build

      # --- E2E: instalar y correr ---
      - name: Instalar dependencias e2e
        working-directory: e2e
        run: npm ci
      - name: Instalar navegador Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Correr e2e
        working-directory: e2e
        run: npm test
      - name: Subir reporte si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
